name: ci

# The order below is the architecture and must not be reordered:
#
#   dvc pull -> dvc repro -> run_ci_test.py -> docker build -> docker push
#
# The evaluator only CONSUMES the index that dvc repro produced. It never
# builds one, which is why Docker build/push must happen AFTER it passes:
# the image is published only for a configuration whose RAG pipeline
# actually answered the CI questions faithfully.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Required so `dvc pull` can fetch the cached index data.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `dvc[s3]` is needed by the workflow (dvc pull/repro);
          # the indexing extra supplies pymupdf/pypdf/text-splitters.
          pip install "dvc[s3]"
          pip install -e ".[indexing]"
          pip install mlflow

      - name: Configure DVC remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Credentials are read from the environment by DVC's S3 backend.
          dvc remote list || true

      - name: DVC pull (restore the cached data + index)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull

      - name: DVC repro (restore/rebuild the production vector index)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GEMINAI_API_KEY: ${{ secrets.GEMINAI_API_KEY }}
        run: dvc repro

      - name: Run CI evaluation (RAGAS Faithfulness gate)
        env:
          GEMINAI_API_KEY: ${{ secrets.GEMINAI_API_KEY }}
        # run_ci_test.py exits 0 on PASS, 1 on FAIL, 2 on error. Any
        # non-zero code fails the job, so Docker is never built/pushed
        # for an unfaithful or broken pipeline.
        run: python run_ci_test.py

      - name: Build Docker image
        run: docker build -t egyptian-civil-rag:${{ github.sha }} .

      - name: Push Docker image
        run: docker push egyptian-civil-rag:${{ github.sha }}
