name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:

  # ============================================================
  # 1. PRE-COMMIT
  # ============================================================
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files


  # ============================================================
  # 2. TEST
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest

      - name: Upload uv.lock as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock


  # ============================================================
  # 3. BUILD INDEX + REGRESSION EVALUATION
  # ============================================================
  evaluate-regression:
    name: Build index and evaluate regression
    runs-on: ubuntu-latest
    needs: test

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.DVC_S3_ENDPOINT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Install DVC with S3 support
        run: uv pip install "dvc[s3]"

      - name: Pull DVC data
        run: uv run dvc pull

      - name: Reproduce DVC pipeline
        run: uv run dvc repro

      - name: Verify production vector store exists
        run: |
          test -d artifacts/vector_store
          echo "Production vector store exists."

      - name: Run CI regression evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run python run_ci_test.py

      - name: Upload production vector store
        uses: actions/upload-artifact@v4
        with:
          name: production-vector-store
          path: artifacts/vector_store/


  # ============================================================
  # 4. BUILD + PUSH DOCKER IMAGE
  # ============================================================
  build-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: evaluate-regression

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download production vector store
        uses: actions/download-artifact@v4
        with:
          name: production-vector-store
          path: artifacts/vector_store

      - name: Verify vector store
        run: |
          test -d artifacts/vector_store
          echo "Vector store downloaded successfully."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/egyptian-civil-rag:latest
