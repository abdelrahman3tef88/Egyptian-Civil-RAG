# ==============================================================
# Prometheus + Grafana for the RAG stack
# --------------------------------------------------------------
# The applications run on the HOST (FastAPI on :8000, BentoML's
# metrics server on :9001); this stack only runs the monitoring
# tools and scrapes those host endpoints.
#
# Start (from the repository root):
#   docker compose -f monitoring/deployment/docker-compose.yml up -d
#
# URLs:
#   Prometheus : http://localhost:9090
#   Grafana    : http://localhost:3001  (admin / admin by default -
#                change the GF_SECURITY_ADMIN_* env vars in .env)
#
# host.docker.internal reaches the host from the container on
# Docker Desktop (Windows/macOS). On Linux, the compose file adds
# an extra_hosts mapping to cover that case too.
# ==============================================================

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rag-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
