# ==========================================================
# Central configuration for the Egyptian Civil Code RAG project
# ----------------------------------------------------------
# All configurable values / hyperparameters live here. Modules
# load their values from this file through
# rag_project/config/settings.py instead of hard-coding them.
# ==========================================================

# --------------------------
# Chunking (RecursiveCharacterTextSplitter)
# --------------------------
chunking:
  chunk_size: 384
  chunk_overlap: 50

# --------------------------
# Embedding model
# --------------------------
embedding:
  embedding_model: BAAI/bge-m3
  # "auto" -> use CUDA when available, otherwise CPU
  device: auto
  normalize_embeddings: true

# --------------------------
# Vector database
# --------------------------
vector_db:
  type: chroma
  # Persisted index directory (relative to the project root)
  persist_directory: artifacts/vector_store
  collection_name: egyptian_civil_code

# --------------------------
# Retrieval
# --------------------------
retrieval:
  search_type: similarity
  top_k: 7

# --------------------------
# Generation (LLM)
# --------------------------
generation:
  # Model that produces the RAG answer (question + retrieved context).
  # Google Gemini; the API key is GEMINAI_API_KEY (see .env).
  model: gemini/gemini-3.1-flash-lite
  # Model that judges Faithfulness (answer + retrieved contexts).
  # Same Gemini model and same key as the generator; the judge keeps its
  # own model entry so both roles stay visible in MLflow.
  judge_model: gemini/gemini-3.1-flash-lite
  # Lower temperature = more factual / deterministic answers.
  temperature: 0
  judge_temperature: 0

# --------------------------
# Remote vLLM generation server (replaces Gemini in the serving path)
# ----------------------------------------------------------
vllm:
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen3-8B-AWQ
  api_key: ""
  timeout_seconds: 300
  max_tokens: 4096

# --------------------------
# Faithfulness evaluation backend (RAGAS)
# ----------------------------------------------------------
# NOTE: `enabled` here only gates the ONLINE, per-request evaluation in
# service/bentoml_service.py (LLM-as-judge on every /ask_json call - it
# adds latency and judge cost). It defaults to OFF; opt in with
# ONLINE_EVAL_ENABLED=1. The offline MLflow experiment has its own switch
# in experiments/mlflow/experiment_config.yaml and is unaffected.
evaluation:
  backend: ragas
  enabled: false
  gemini_evaluator_model: ""

# --------------------------
# Embedding drift detection
# ----------------------------------------------------------
drift:
  threshold: 0.45
  reference_questions_path: data/reference_questions.json
  baseline_cache_path: monitoring/baseline/reference_embeddings.json
  model: BAAI/bge-m3
  device: auto
  reference_count: 50

# --------------------------
# Observability (Langfuse)
# ----------------------------------------------------------
langfuse:
  host: https://cloud.langfuse.com
  public_key: ""
  secret_key: ""
  release: ""
  sample_rate: 1.0




# --------------------------
# Data paths
# --------------------------
data:
  # Structured articles produced by the ingestion stage
  articles_json: data/processed/articles.json
