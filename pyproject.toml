[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-civil-rag-project"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    # RAGAS is the ACTIVE Faithfulness evaluator of the MLflow experiment
    # (experiments/mlflow/experiment_config.yaml -> evaluation.backend).
    "ragas>=0.4.3",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
]

[project.optional-dependencies]
indexing = [
    "pymupdf>=1.24.0",
    "pypdf>=6.19.0",
    "langchain-text-splitters>=1.1.2",
]

# Serving layer (service/ + locustfile.py).
# ضفناها هنا مش في الـcore عشان الـCI و DVC pipeline مش محتاجينها،
# والتوجّه زي مجموعات `dvc` و`experiments` و`indexing` الموجودة أصلًا.
# التنصيب:
#     uv sync --extra serving
#
# openai متكرّرة عشان llm_client.py بيستورد منها مباشرة (AsyncOpenAI).
# bentoml / locust مش مكنينين لسه في البيئة الحالية.
serving = [
    "openai>=3.0.0",
    "bentoml>=1.3.0",
    "locust>=2.31.0",
]

dvc = [
    "dvc[s3]>=3.67.1",
]

experiments = [
    "mlflow>=3.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." (جذر المشروع) ضروري عشان الاختبارات تقدر تلاقي حزمة service/
# اللي chain.py بيستوردها في build_rag_chain().
pythonpath = ["src", "."]
